[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "commandflow-backend"
version = "0.1.0"
description = "Backend del intérprete CommandFlow"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "starlette==1.10.0",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
